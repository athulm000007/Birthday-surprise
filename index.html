<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe6f0, #fff5f8);
      font-family: Arial, sans-serif;
      text-align: center;
      color: #444;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      color: #ff4f81;
      font-size: 36px;
      margin-bottom: 10px;
    }

    h2 {
      color: #ff6f91;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .photo {
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .message {
      margin: 25px auto;
      max-width: 500px;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Happy Birthday ❤️</h1>

    <h2>To Someone Very Special 💕</h2>

    <div class="message">
      <p>
        Wishing you the happiest birthday! 🎂❤️
      </p>

      <p>
        I hope your day is filled with happiness,
        smiles and beautiful memories. 💗
      </p>
    </div>

    <h2>Our Special Memory 📸</h2>

    <img class="photo" src="photo1.jpg" alt="Special memory">

  </div>

</body>
</html>
